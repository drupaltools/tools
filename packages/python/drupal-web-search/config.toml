[engines]
default = "brave"
fallback_order = ["bing", "duckduckgo", "perplexity"]

[engines.duckduckgo]
enabled = true

[engines.yahoo]
enabled = true

[engines.brave]
api_key = "${BRAVE_API_KEY}"
enabled = true

[engines.google]
enabled = true

[engines.bing]
enabled = true

[engines.perplexity]
api_key = "${PERPLEXITY_API_KEY}"
enabled = true

[engines.firecrawl]
api_key = "${FIRECRAWL_API_KEY}"
enabled = true

[engines.exa]
api_key = "${EXA_API_KEY}"
enabled = true

[engines.tavily]
api_key = "${TAVILY_API_KEY}"
enabled = true

[engines.serpapi]
api_key = "${SERPAPI_API_KEY}"
enabled = true

[engines.linkup]
api_key = "${LINKUP_API_KEY}"
enabled = true

[engines.jina]
api_key = "${JINA_API_KEY}"
enabled = true

# AI provider web search engines
[engines.openai_search]
api_key = "${OPENAI_API_KEY}"
enabled = false
model = "gpt-4o-mini"

[engines.claude_search]
api_key = "${ANTHROPIC_API_KEY}"
enabled = false
model = "claude-haiku-4-20250514"

[engines.gemini_search]
api_key = "${GEMINI_API_KEY}"
enabled = false
model = "gemini-2.0-flash-lite"

[engines.grok_search]
api_key = "${XAI_API_KEY}"
enabled = false
model = "grok-4-mini"

[engines.openrouter]
api_key = "${OPENROUTER_API_KEY}"
enabled = false
model = "openai/gpt-4o-mini"

[search]
num_results = 10
safe_search = "moderate"
timeout = 30

[site_preferences]
restrict_to = [
    "drupal.org",
    "api.drupal.org",
    "git.drupalcode.org",
    "drupal.stackexchange.com"
]
preferred = [
    "github.com",
    "git.drupalcode.org",
    "github.com/theodorosploumis/awesome-drupal",
    "github.com/theodorosploumis/drupal-best-practices",
    "www.drupalatyourfingertips.com",
    "www.drupalbook.org",
]
blocked = ["spam-site.com"]
