[engines]
default = "brave"
fallback_order = ["bing", "duckduckgo", "perplexity"]

[engines.duckduckgo]
enabled = true

[engines.yahoo]
enabled = true

[engines.brave]
api_key = "${BRAVE_API_KEY}"
enabled = true

[engines.google]
enabled = true

[engines.bing]
enabled = true

[engines.perplexity]
api_key = "${PERPLEXITY_API_KEY}"
enabled = true

[engines.firecrawl]
api_key = "${FIRECRAWL_API_KEY}"
enabled = true

[engines.exa]
api_key = "${EXA_API_KEY}"
enabled = true

[engines.tavily]
api_key = "${TAVILY_API_KEY}"
enabled = true

[engines.serpapi]
api_key = "${SERPAPI_API_KEY}"
enabled = true

[engines.linkup]
api_key = "${LINKUP_API_KEY}"
enabled = true

[engines.jina]
api_key = "${JINA_API_KEY}"
enabled = true

[search]
num_results = 10
safe_search = "moderate"
timeout = 30

[site_preferences]
restrict_to = [
    "drupal.org",
    "api.drupal.org",
    "git.drupalcode.org",
    "drupal.stackexchange.com"
]
preferred = [
    "github.com",
    "git.drupalcode.org",
    "github.com/theodorosploumis/awesome-drupal",
    "github.com/theodorosploumis/drupal-best-practices",
    "www.drupalatyourfingertips.com",
    "www.drupalbook.org",
]
blocked = ["spam-site.com"]
