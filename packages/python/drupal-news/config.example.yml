# Drupal News Aggregator - Configuration Examples
# =================================================
# Copy this file to config.yml and customize with your settings.
# This file contains examples for various AI providers and configurations.

# Core Settings
# -------------
core:
  timeframe_days: 7                    # Number of days to look back
  run_root: runs                        # Directory for output runs

  # HTTP client settings
  http:
    timeout_sec: 20                     # Request timeout in seconds
    retries: 2                          # Number of retries on failure
    user_agent: DrupalNewsBot/1.0       # User agent string

  # Email settings
  email:
    subject_prefix: "[Drupal Newsletter]"
    attach_summary: true                # Attach summary to email
    attachment_format: pdf              # pdf or html

  # Markdown output settings
  markdown:
    table_max_rows: 200                 # Max rows in markdown tables

# SMTP Configuration
# ------------------
# Email server settings for sending newsletters
#
# RECOMMENDED: Use environment variable references (most secure)
smtp:
  host: ${SMTP_HOST}          # References .env file
  port: ${SMTP_PORT}          # References .env file
  user: ${SMTP_USER}          # References .env file
  password: ${SMTP_PASS}      # References .env file
  timeout: ${SMTP_TIMEOUT}    # References .env file (default: 30)
  mail_from: ${MAIL_FROM}     # References .env file
  mail_to: ${MAIL_TO}         # References .env file

# ALTERNATIVE: Use direct values (less secure, but simpler for testing)
# smtp:
#   host: smtp.gmail.com
#   port: 587
#   user: your-email@gmail.com
#   password: your-16-char-app-password
#   timeout: 30
#   mail_from: your-email@gmail.com
#   mail_to: recipient@example.com

# Gmail users: Use an "App Password" instead of your regular password
# Generate one at: https://myaccount.google.com/apppasswords

# LEGACY: Omit smtp section entirely and use only .env variables
# (Still supported for backward compatibility)

# Content Sources
# ---------------
sources:
  # RSS feeds to aggregate
  rss:
    - https://www.drupal.org/node/3060/release/feed
    - https://www.drupal.org/section-blog/all/feed
    - https://www.drupal.org/project/issues/rss/ai_initiative
    - https://www.drupal.org/taxonomy/term/9988/feed
    - https://www.drupal.org/planet/rss.xml
    - https://events.drupal.org/rss.xml
    - https://www.drupal.org/security/all/rss.xml

  # Web pages with optional CSS selectors
  # Format 1: Simple URL string
  # Format 2: Object with CSS selectors for precise scraping
  pages:
    # Simple format
    - https://www.drupal.org/news

    # Advanced format with custom CSS selectors
    - url: https://www.drupal.org/community
      name: Drupal Community
      base_url: https://www.drupal.org
      selectors:
        container: article               # Container element
        title: h2                        # Title selector
        link: h2 a                       # Link selector
        description: .field--name-body   # Description selector
        date: time                       # Date selector

# AI Providers Configuration
# ---------------------------
ai:
  # Default provider to use
  default_provider: openrouter

  # Fallback order if default fails (optional)
  # fallback_order:
  #   - openrouter
  #   - ollama
  #   - anthropic

  # Provider definitions
  providers:
    # ====================
    # CLOUD PROVIDERS
    # ====================

    # OpenAI GPT Models
    openai:
      client: openai_client
      model: gpt-4.1-mini
      temperature: 0.2
      # api_url: https://api.openai.com/v1  # Optional: custom endpoint
      # pricing:  # Optional: for cost estimation
      #   input_cost_per_1k: 0.0015
      #   output_cost_per_1k: 0.002

    # Anthropic Claude Models
    anthropic:
      client: anthropic_client
      model: claude-haiku-4-5-20251001
      # Alternative models:
      # model: claude-sonnet-4-5-20250514
      # model: claude-opus-4-5-20250514
      temperature: 0.2
      # api_url: https://api.anthropic.com

    # Google Gemini Models
    gemini:
      client: gemini_client
      model: gemini-1.5-pro
      # Alternative: gemini-2.0-flash-exp
      temperature: 0.2
      # api_url: https://generativelanguage.googleapis.com

    # Alibaba Qwen Models (DashScope)
    qwen:
      client: qwen_client
      model: qwen2.5-7b-chat
      # Alternative: qwen-max, qwen-plus
      temperature: 0.2
      # api_url: https://dashscope.aliyuncs.com/api/v1

    # xAI Grok Models
    grok:
      client: grok_client
      model: grok-4-fast-reasoning
      # Alternative: grok-beta
      temperature: 0.2
      # api_url: https://api.x.ai/v1

    # DeepSeek Models
    deepseek:
      client: deepseek_client
      model: deepseek-chat
      temperature: 0.2
      # api_url: https://api.deepseek.com

    # z.ai GLM-4.6 (Anthropic-compatible endpoint)
    zai:
      client: anthropic_client
      model: glm-4.6
      temperature: 0.2
      api_url: https://api.z.ai/api/anthropic

    # MiniMax MiniMax-M2 (Anthropic-compatible endpoint)
    minimax:
      client: anthropic_client
      model: minimax-m2
      temperature: 0.2
      api_url: https://api.minimax.io/anthropic

    # ====================
    # LOCAL PROVIDERS
    # ====================

    # Ollama (local models)
    ollama:
      client: ollama_client
      model: qwen2.5:7b-instruct
      # Alternative models: llama3.2, mistral, granite3.3:8b
      temperature: 0.2
      # api_url: http://localhost:11434     # Default Ollama endpoint

    # LM Studio (local models)
    lmstudio:
      client: lmstudio_client
      model: qwen2.5:7b-instruct
      temperature: 0.2
      # api_url: http://localhost:1234      # Default LM Studio endpoint

    # ====================
    # AGGREGATORS & PROXIES
    # ====================

    # OpenRouter (multi-provider aggregator)
    openrouter:
      client: openrouter_client
      model: openai/gpt-oss-20b:free
      # Alternative models:
      # model: meta-llama/llama-3.1-70b-instruct
      # model: anthropic/claude-3.5-sonnet
      # model: google/gemini-pro-1.5
      temperature: 0.2
      api_url: https://openrouter.ai/api/v1
      headers:
        Authorization: Bearer ${OPENROUTER_API_KEY}
        HTTP-Referer: https://drupal-news.org  # Optional: for OpenRouter ranking
        X-Title: Drupal News Aggregator        # Optional: app identifier

    # ====================
    # GENERIC CLIENT EXAMPLES
    # ====================
    # The generic_client works with ANY OpenAI-compatible API

    # Generic - Together AI
    together:
      client: generic_client
      model: mistralai/Mixtral-8x7B-Instruct-v0.1
      temperature: 0.2
      api_url: https://api.together.xyz/v1
      headers:
        Authorization: Bearer ${TOGETHER_API_KEY}

    # Generic - Groq
    groq:
      client: generic_client
      model: llama-3.1-70b-versatile
      temperature: 0.2
      api_url: https://api.groq.com/openai/v1
      headers:
        Authorization: Bearer ${GROQ_API_KEY}

    # Generic - Perplexity
    perplexity:
      client: generic_client
      model: sonar
      temperature: 0.2
      api_url: https://api.perplexity.ai
      headers:
        Authorization: Bearer ${PERPLEXITY_API_KEY}

    # Generic - Fireworks AI
    fireworks:
      client: generic_client
      model: accounts/fireworks/models/llama-v3p1-70b-instruct
      temperature: 0.2
      api_url: https://api.fireworks.ai/inference/v1
      headers:
        Authorization: Bearer ${FIREWORKS_API_KEY}

    # Generic - Azure OpenAI
    azure:
      client: generic_client
      model: gpt-4                      # Your deployment name
      temperature: 0.2
      api_url: https://YOUR-RESOURCE.openai.azure.com/openai/deployments/YOUR-DEPLOYMENT
      headers:
        api-key: ${AZURE_OPENAI_API_KEY}

    # Generic - LiteLLM Proxy (any model)
    litellm:
      client: generic_client
      model: gpt-4                      # Model name from litellm_config.yaml
      temperature: 0.2
      api_url: http://localhost:4000
      # headers:                         # Optional: if using master_key
      #   Authorization: Bearer your-litellm-master-key

    # Generic - Custom self-hosted endpoint
    custom:
      client: generic_client
      model: your-custom-model
      temperature: 0.2
      api_url: https://your-custom-endpoint.com/v1
      headers:
        Authorization: Bearer your-custom-token
        X-Custom-Header: custom-value

    # ====================
    # PROXY EXAMPLES
    # ====================

    # Grok via Portkey proxy
    grok_portkey:
      client: grok_client
      model: grok-beta
      temperature: 0.2
      api_url: https://api.portkey.ai/v1
      headers:
        x-portkey-api-key: YOUR_PORTKEY_API_KEY_HERE
        x-portkey-virtual-key: YOUR_GROK_VIRTUAL_KEY_HERE
        # Optional Portkey features:
        # x-portkey-trace-id: drupal-news-trace
        # x-portkey-cache-force-refresh: true

    # OpenRouter via Portkey (proxy through proxy)
    openrouter_portkey:
      client: openrouter_client
      model: meta-llama/llama-3.1-8b-instruct
      temperature: 0.2
      api_url: https://api.portkey.ai/v1
      headers:
        x-portkey-api-key: YOUR_PORTKEY_API_KEY_HERE
        x-portkey-provider: openrouter

    # Multiple OpenRouter configurations with different models
    openrouter_llama:
      client: generic_client
      model: meta-llama/llama-3.1-70b-instruct
      temperature: 0.2
      api_url: https://openrouter.ai/api/v1
      headers:
        Authorization: Bearer ${OPENROUTER_API_KEY}

    openrouter_claude:
      client: generic_client
      model: anthropic/claude-3.5-sonnet
      temperature: 0.2
      api_url: https://openrouter.ai/api/v1
      headers:
        Authorization: Bearer ${OPENROUTER_API_KEY}

    openrouter_gemini:
      client: generic_client
      model: google/gemini-pro-1.5
      temperature: 0.2
      api_url: https://openrouter.ai/api/v1
      headers:
        Authorization: Bearer ${OPENROUTER_API_KEY}

    # Generic with environment variable fallbacks
    generic_fallback:
      client: generic_client
      model: meta-llama/llama-3.1-70b-instruct
      temperature: 0.2
      # api_url not set -> uses GENERIC_API_URL from environment
      # headers not set -> uses GENERIC_API_KEY from environment

# AI Prompt Template
# -------------------
# Customize the prompt used for generating summaries.
# Available placeholders: {timeframe_days}, {timezone}, {items_text}
prompt: |
  # Drupal Summarizer Prompt

  You are a technical writer for the Drupal community. Generate a summary of Drupal news and updates.

  **Requirements:**

  1. Ignore Drupal modules with the `/sandbox/` string on their URL.
  2. Ignore Drupal core `dev` releases.
  3. Focus on AI module and news on AI.
  4. Each fact MUST include a link.
  5. Use clear, factual language - no hype.
  6. No duplicate URLs.
  7. Add an H3 header-title for each fact and the summary below it for non Drupal projects.
  8. If no major updates: include "No significant core updates this week". Nothing more.
  9. Present RSS of new modules as a table with columns: Module, Description. Module column displays the Name and below the name show the URL. The URL should show the machine_name as text.
  10. On sources related to AI give me a more extended summary.
  11. Exclude sources that seem promotion calls.
  12. Never write on the results how you think.
  13. Organize by sections: Core and Security updates, Modules, AI/Automation, Admin UI/UX, Drupal Planet, Drupal.org News, Events

  **Timeframe:** Last {timeframe_days} days ({timezone})

  **Items to summarize:**

  {items_text}

  Generate the summary in Markdown format with proper sections and source links.

# API Keys
# ---------
# Store sensitive keys here or use environment variables.
# Environment variables always take precedence.
# Format: ${VAR_NAME} to reference environment variables
api_keys:
  # Required for respective providers
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}          # sk-ant-api03-...
  OPENAI_API_KEY: ${OPENAI_API_KEY}                # sk-proj-...
  GOOGLE_API_KEY: ${GOOGLE_API_KEY}                # AIza...
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}        # sk-or-v1-...
  PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY}        # pplx-...
  XAI_API_KEY: ${XAI_API_KEY}                      # xai-...
  GROQ_API_KEY: ${GROQ_API_KEY}                    # gsk_...
  MISTRAL_API_KEY: ${MISTRAL_API_KEY}              # ...
  AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}    # ...
  TOGETHER_API_KEY: ${TOGETHER_API_KEY}            # ...
  FIREWORKS_API_KEY: ${FIREWORKS_API_KEY}          # ...

  # New Anthropic-compatible providers
  ZAI_API_KEY: ${ZAI_API_KEY}                      # For z.ai GLM-4.6
  MINIMAX_API_KEY: ${MINIMAX_API_KEY}              # For MiniMax MiniMax-M2

  # Optional keys
  OLLAMA_API_KEY: ${OLLAMA_API_KEY}                # For remote Ollama servers
  GITHUB_API_KEY: ${GITHUB_API_KEY}                # For GitHub features (ghp_...)

  # Generic fallback keys (when api_url/headers not specified in provider)
  GENERIC_API_KEY: ${GENERIC_API_KEY}
  GENERIC_API_URL: ${GENERIC_API_URL}

# Other environment settings:
#   TIMEZONE=Europe/Athens                 # Timezone for date/time operations
#   LOG_RETENTION_DAYS=45                  # How long to keep log files
#   RUN_RETENTION_DAYS=90                  # How long to keep run directories
#   CACHE_DB_PATH=./cache/cache.db         # SQLite cache database location
#   CACHE_TTL_DAYS=21                      # Cache time-to-live in days

# Configuration Tips
# ------------------
# 1. Start with config.example.yml:
#    cp config.example.yml config.yml
#
# 2. Create .env file with SMTP credentials:
#    cp .env.example .env  # (then edit .env with your settings)
#
# 3. Set your API keys in environment or in api_keys section:
#    export OPENROUTER_API_KEY="sk-or-v1-..."
#
# 4. Choose your default provider:
#    ai.default_provider: openrouter
#
# 5. Test with dry run (skips AI and email):
#    drupal-news --dry-run --days 7
#
# 6. Test email configuration:
#    drupal-news-email
#
# 7. Run full pipeline:
#    drupal-news --days 7
#
# 8. For multiple providers, define each with unique name:
#    ai.providers.openrouter_free: {...}
#    ai.providers.openrouter_paid: {...}
#
# 9. Use generic_client for maximum flexibility:
#    Works with ANY OpenAI-compatible endpoint
#
# 10. Try the new Anthropic-compatible providers:
#     export ZAI_API_KEY="your_zai_key"
#     export MINIMAX_API_KEY="your_minimax_key"
#     drupal-news --provider zai
#     drupal-news --provider minimax
#
# 11. See docs/ for detailed guides:
#     - docs/CUSTOM_API_URLS.md
#     - docs/GENERIC_PROVIDER.md
#     - docs/PAGE_SELECTORS.md
